# 生产差异层：在 compose.yaml 之上叠加（HTTPS + 证书自动续期）
# 用法：./deploy/deploy.sh prod
# 前置：script/setup-https.sh 已签发证书并渲染 deploy/nginx/runtime/default.conf
services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/runtime/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # 每 6 小时 reload 一次以吃到续期后的证书
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    labels:
      resume.project: "CodeYang 在线简历"
      resume.service: "证书续期 · certbot（Let's Encrypt 自动续期）"
      resume.layer: "接入层"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 每 12 小时尝试续期（Let's Encrypt 证书 90 天有效，30 天内可续）
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"

volumes:
  certbot-conf:
  certbot-www:
