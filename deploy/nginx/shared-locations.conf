# 共享 location/指令段：nginx.conf（本地 HTTP 档）与 nginx.prod.conf（生产 HTTPS 模板）
# 都在 server{} 内 include 本文件；两模板的有意差异（/resume.pdf 的缓存头、dev 的 HMR
# Upgrade 头）留在各自文件。容器内路径 /etc/nginx/shared-locations.conf（compose ro 挂载）。

gzip on;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# 公网可读的 API（只允许 GET/HEAD）
location /api/v1/resume/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location /api/v1/health {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# 其余 API 一律不暴露（写接口只走内网 + 令牌）
location /api/ {
    return 404;
}

# ---- AI 问答网关（chat 服务）----
# 聊天窗 REST（/chat/api/*）+ WS 长连接（/chat/ws/:sessionId）
location /chat/ {
    proxy_pass http://chat:3210;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 会话空闲上限 20min，读超时放宽到 1h 以保住 WS 长连接
    proxy_read_timeout 3600s;
}

client_max_body_size 1m;
