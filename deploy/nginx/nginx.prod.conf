# 生产 HTTPS 模板：__DOMAIN__ 由 script/setup-https.sh 渲染为 deploy/nginx/runtime/default.conf
# 80 仅做跳转与 ACME 验证；443 TLS 终结后反代
# 共享段（gzip / API / chat）在 shared-locations.conf；本文件只留 prod 特有差异：
# /resume.pdf 的 no-store 头（灰云时期保留的双保险，见 SKILL.md）

# ---- HTTP：跳转 + 证书验证 ----
server {
    listen 80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /etc/nginx/shared-locations.conf;

    # PDF 导出（只允许 GET/HEAD，生成耗时较长放宽读超时）
    location = /resume.pdf {
        limit_except GET HEAD { deny all; }
        proxy_pass http://host.docker.internal:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        # 曾应对 CF 代理把 .pdf 缓存 4h；2026-09-08 已切灰云直连，保留 no-store 作双保险
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
