# 本地开发/HTTP 档：仅暴露读接口与静态前端
# 共享段（gzip / API / chat）在 shared-locations.conf；本文件只留 dev 特有差异：
# /resume.pdf 直连宿主机 pdf 服务；location / 带 HMR Upgrade 头（next dev 热更新）

server {
    listen 80;
    server_name _;

    include /etc/nginx/shared-locations.conf;

    # PDF 导出（只允许 GET/HEAD，生成耗时较长放宽读超时）
    location = /resume.pdf {
        limit_except GET HEAD { deny all; }
        proxy_pass http://host.docker.internal:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # 前端（dev：带 Upgrade 头支撑 HMR）
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
